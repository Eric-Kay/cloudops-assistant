name: Deploy CloudOps Assistant

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  AWS_REGION: us-east-1
  BACKEND_ECR_REPOSITORY: cloudops-assistant
  UI_ECR_REPOSITORY: cloudops-assistant-ui
  ECS_CLUSTER: cloudops-assistant-cluster
  BACKEND_ECS_SERVICE: cloudops-assistant-service
  UI_ECS_SERVICE: cloudops-assistant-ui-service

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Get AWS account ID
        id: aws
        run: |
          echo "account_id=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_OUTPUT"

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build backend Docker image
        run: |
          BACKEND_IMAGE_URI=${{ steps.aws.outputs.account_id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.BACKEND_ECR_REPOSITORY }}:${{ github.sha }}
          docker build -f infra/Dockerfile -t $BACKEND_IMAGE_URI .
          echo "BACKEND_IMAGE_URI=$BACKEND_IMAGE_URI" >> "$GITHUB_ENV"

      - name: Push backend Docker image
        run: |
          docker push $BACKEND_IMAGE_URI

      - name: Build UI Docker image
        run: |
          UI_IMAGE_URI=${{ steps.aws.outputs.account_id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.UI_ECR_REPOSITORY }}:${{ github.sha }}
          docker build -f frontend/Dockerfile -t $UI_IMAGE_URI .
          echo "UI_IMAGE_URI=$UI_IMAGE_URI" >> "$GITHUB_ENV"

      - name: Push UI Docker image
        run: |
          docker push $UI_IMAGE_URI

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: terraform
        run: terraform init

      - name: Terraform fmt
        working-directory: terraform
        run: terraform fmt -recursive

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform apply
        working-directory: terraform
        run: |
          terraform apply -auto-approve \
            -var="app_image=${BACKEND_IMAGE_URI}" \
            -var="ui_image=${UI_IMAGE_URI}"

      - name: Force ECS backend deployment
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $BACKEND_ECS_SERVICE \
            --force-new-deployment \
            --region $AWS_REGION

      - name: Force ECS UI deployment
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $UI_ECS_SERVICE \
            --force-new-deployment \
            --region $AWS_REGION

      - name: Wait for ECS services to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster $ECS_CLUSTER \
            --services $BACKEND_ECS_SERVICE $UI_ECS_SERVICE \
            --region $AWS_REGION

      - name: Print app URL
        working-directory: terraform
        run: terraform output app_url